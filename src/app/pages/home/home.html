<section class="stage">
  <app-collage-stage [layers]="back" />

  <h1 class="wordmark" aria-label="XXXtreme Sports">
    <span>XXX</span><span>TREME</span><span>SPORTS</span>
  </h1>

  @if (products.hasValue()) {
    @if (view() === 'cloud' && !loop.reducedMotion()) {
      <app-product-cloud class="cloud" [products]="products.value()" [turbulence]="turbulence()" />
    } @else {
      <app-product-grid class="grid" [products]="products.value()" />
    }
  } @else if (products.error()) {
    <p class="status">The swarm couldn't load: {{ products.error() }}</p>
  } @else {
    <p class="status blink">summoning the swarm…</p>
  }

  <app-collage-stage class="front" [layers]="front" />
</section>

<div class="controls">
  <button type="button" (click)="toggleView()">{{ view() === 'cloud' ? '▦ grid' : '☁ cloud' }}</button>
  @if (view() === 'cloud') {
    <label>
      storm
      <input type="range" min="0" max="3" step="0.1" [value]="turbulence()" (input)="turbulence.set(+$any($event.target).value)" />
    </label>
  }
  @if (catalog.isMock) {
    <span class="mock">mock catalogue</span>
  }
</div>
